[tool.poetry]
name = "ares-sc2"
version = "3.13.0"
description = ""
authors = ["Tom Kerr <tomkerrdev@gmail.com>, Paul <paul@ares.com>"]
readme = "README.md"
packages = [{include = "src/ares"}]
homepage = "https://github.com/AresSC2/ares-sc2"
repository = "https://github.com/AresSC2/ares-sc2"
license = "MIT"

[tool.poetry.dependencies]
python = ">=3.11, <3.13"
burnysc2 = { git = "https://github.com/august-k/python-sc2", branch = "develop" }
PyYAML = "^6.0.2"
tqdm = "^4.64.1"
scikit-learn = "^1.2.2"
map-analyzer = { git = "https://github.com/spudde123/SC2MapAnalysis", branch = "develop" }
cython-extensions-sc2 = "^0.17.0"
mypy = ">=1.11"

[tool.poetry.group.docs]
optional = true

[tool.poetry.group.lint]
optional = true

[tool.poetry.group.test]
optional = true

[tool.poetry.group.semver]
optional = true

[tool.poetry.group.lint.dependencies]
mypy = "^2.3.0"
ruff = "^0.16.3"
pre-commit = "^4.6.2"

[tool.poetry.group.test.dependencies]
pytest = "^9.1.1"
pytest-cov = "^7.1.0"
pytest-asyncio = "^1.4.0"

[tool.poetry.group.docs.dependencies]
mkdocs = "^1.6.1"
mkdocs-material = "^9.0.6"
mkdocstrings = {extras = ["python"], version = "^0.27.0"}

[tool.poetry.group.semver.dependencies]
python-semantic-release = "^7.33.0"

[tool.poetry.group.notebook.dependencies]
ipykernel = "^7.3.0"
matplotlib = "^3.7.1"
line-profiler = "^5.0.2"
jupyter = "^1.1.1"

[build-system]
requires = ["poetry-core", "Cython", "numpy", "setuptools"]
build-backend = "poetry.core.masonry.api"

[tool.coverage.report]
exclude_lines = [
    'if __name__ == "__main__":'
]
exclude_also = [
    "pass",
    "if TYPE_CHECKING:"
]
# only omitting files, where it seems there
# are no reasonable ways of unit testing them
omit = [
    "src/ares/chat_debug.py",
    "src/ares/behaviors/combat/combat_behavior.py"
    ]

[tool.pytest.ini_options]
testpaths = ["src", "tests"]
addopts = "-p no:cacheprovider" # deactivating pytest caching.
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
    # note the use of single quote below to denote "raw" strings in TOML
    'ignore:function ham\(\) is deprecated:DeprecationWarning',
]

[tool.ruff]
line-length = 88
[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "SIM",    # flake8-simplify
    "TCH",    # flake8-type-checking
]
ignore = [
    "B027",
    "E501",   # line too long (handled by formatter)
    "E402",
    "TC001",
    "TC002",
    "TC003",
]
[tool.ruff.lint.isort]
known-first-party = ["ares"]

[tool.mypy]
# 3rd party import
ignore_missing_imports = true
# dynamic typing (relaxed: several 3rd party deps ship without py.typed, so
# disallow_any_unimported / untyped-defs strictness is not achievable)
disallow_any_unimported = false
disallow_any_expr = false
disallow_any_decorated = false
disallow_any_explicit = false
disallow_any_generics = false
disallow_subclassing_any = false
# platform
python_version = "3.13"
# resolve ares package under src/ (src layout) without module name conflicts
explicit_package_bases = true
# untyped
disallow_untyped_calls = false
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_decorators = false
# Check bodies even when a function's signature is not fully annotated.
check_untyped_defs = true
# None and Optional
no_implicit_optional = true
# Warnings
warn_return_any = false
warn_unreachable = true
# Misc
pretty = true
# This file will be removed later
exclude = "src/ares/example_docstrings.py"

[[tool.mypy.overrides]]
module = "yaml"
ignore_missing_imports = true

[tool.semantic_release]
branch = "main"
version_variable = "src/ares/__init__.py:__version__"
version_toml = "pyproject.toml:tool.poetry.version"
version_source = "tag"
commit_version_number = true # required for version_source = "tag"
tag_commit = true
# might want these true later
upload_to_pypi = false
upload_to_release = false
hvcs = "github"
commit_message = "{version} [skip ci]" # skip triggering ci pipelines for version commits
