# Save the game opening and result to disk?
# Setting to `True` allows Ares to select a new opening after defeat
UseData: True
# How should we choose a build? Cycle is the only option for now
BuildSelection: WinrateBased # Cycle
MinGamesWinrateBased: 3
# For each Race / Opponent ID choose a build selection
BuildChoices:
    # test_123 is active if Debug: True (set via a `config.yml` file)
    test_123:
        BotName: Test
        Cycle:
            - FastCC
            - ThreeRax
            - OneOneOneStandard
            - OneOneOneMineDrop
            - ReaperOpening
            - TwoOneOne

    Protoss:
        BotName: ProtossRace
        Cycle:
            - FastCC
            - ThreeRax
            - OneOneOneStandard
            - OneOneOneMineDrop
            - ReaperOpening
            - TwoOneOne
    Random:
        BotName: RandomRace
        Cycle:
            - FastCC
            - ThreeRax
            - OneOneOneStandard
            - OneOneOneMineDrop
            - ReaperOpening
            - TwoOneOne

    Terran:
        BotName: TerranRace
        Cycle:
            - FastCC
            - ThreeRax
            - OneOneOneStandard
            - OneOneOneMineDrop
            - ReaperOpening
            - TwoOneOne

    Zerg:
        BotName: ZergRace
        Cycle:
            - FastCC
            - ThreeRax
            - OneOneOneStandard
            - OneOneOneMineDrop
            - ReaperOpening
            - TwoOneOne

Builds:
