UseData: True
# How should we choose a build? Cycle is the only option for now
BuildSelection: WinrateBased
# For each Race / Opponent ID choose a build selection
BuildChoices:
    # test_123 is active if Debug: True (set via a `config.yml` file)
    test_123:
        BotName: Test
        Cycle:
            - AdeptOracle
            - AggressiveStalker
            - BasicOpener
            - OneBaseTempests
            - PhoenixEconomic

    Protoss:
        BotName: ProtossRace
        Cycle:
            - AdeptOracle
            - AggressiveStalker
            - BasicOpener
            - OneBaseTempests
            - PhoenixEconomic

    Random:
        BotName: RandomRace
        Cycle:
            - AdeptOracle
            - AggressiveStalker
            - BasicOpener
            - OneBaseTempests
            - PhoenixEconomic

    Terran:
        BotName: TerranRace
        Cycle:
            - AdeptOracle
            - AggressiveStalker
            - BasicOpener
            - OneBaseTempests
            - PhoenixEconomic

    Zerg:
        BotName: ZergRace
        Cycle:
            - AdeptOracle
            - AggressiveStalker
            - BasicOpener
            - OneBaseTempests
            - PhoenixEconomic

